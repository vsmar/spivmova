[project]
name = "spivmova"
version = "0.1.0"
description = "Application to help learn Ukrainian through lyrics"
readme = "README.md"
authors = [
    { name = "vsmar", email = "vsmarcenac@gmail.com" }
]
requires-python = ">=3.12"
dependencies = [
    "uk-core-news-sm",
    "alembic>=1.19.1",
    "arq>=0.28.0",
    "asyncpg>=0.31.0",
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "pydantic>=2.13.4",
    "pydantic-settings>=2.15.0",
    "redis>=5.3.1",
    "spacy>=3.8.15",
    "sqlalchemy[asyncio]>=2.0.52",
    "uvicorn[standard]>=0.52.4",
]

[tool.uv.sources]
uk-core-news-sm = { url = "https://github.com/explosion/spacy-models/releases/download/uk_core_news_sm-3.8.0/uk_core_news_sm-3.8.0-py3-none-any.whl" }

[project.scripts]
spivmova = "spivmova:main"

[build-system]
requires = ["uv_build>=0.11.7,<0.12.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "mypy>=2.3.1",
    "pytest>=9.1.1",
    "pytest-asyncio>=1.4.0",
    "respx>=0.23.1",
    "ruff>=0.16.4",
]

[tool.ruff]
line-length = 100
[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
markers = ["integration: hits real external APIs, excluded by default"]
addopts = "-m 'not integration'"
